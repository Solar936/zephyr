title: GC9X01X family display controllers - common properties

description: |
  Common properties shared by all GalaxyCoreIC GC9X01X-family display
  controllers (GC9101A, GC9D01N, ...).

include: [mipi-dbi-spi-device.yaml, display-controller.yaml, lcd-controller.yaml]

properties:
  orientation:
    type: string
    default: "normal"
    enum:
      - "normal"
      - "90"
      - "180"
      - "270"
    description: Display rotation (CW) in degrees.

  display-inversion:
    type: boolean
    description: |
      Display inversion mode. Every bit is inverted from the frame memory to
      the display.
