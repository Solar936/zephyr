title: GC9101A display controller (galaxycore,gc9101a)

description: |
  GalaxyCore GC9101A TFT LCD display controller. Defaults match the
  Waveshare 1.28" 240x240 round LCD panel.

compatible: "galaxycore,gc9101a"

include: "galaxycore,gc9x01x-common.yaml"

properties:
  pwrctrl2:
    type: uint8-array
    default: [0x13]
    description: Power-control 2 register (0xC3) value

  pwrctrl3:
    type: uint8-array
    default: [0x13]
    description: Power-control 3 register (0xC4) value

  pwrctrl4:
    type: uint8-array
    default: [0x22]
    description: Power-control 4 register (0xC9) value

  gamma1:
    type: uint8-array
    default: [0x45, 0x09, 0x08, 0x08, 0x26, 0x2A]
    description: Gamma correction 1 register (0xF0, negative polarity) values

  gamma2:
    type: uint8-array
    default: [0x43, 0x70, 0x72, 0x36, 0x37, 0x6F]
    description: Gamma correction 2 register (0xF1) values

  gamma3:
    type: uint8-array
    default: [0x45, 0x09, 0x08, 0x08, 0x26, 0x2A]
    description: Gamma correction 3 register (0xF2, positive polarity) values

  gamma4:
    type: uint8-array
    default: [0x43, 0x70, 0x72, 0x36, 0x37, 0x6F]
    description: Gamma correction 4 register (0xF3) values

  framerate:
    type: uint8-array
    default: [0x34]
    description: Frame rate control register (0xE8) value
